apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-app
  namespace: argocd
spec:
  project: shortner-analytics
  source:
    repoURL: https://github.com/bhatvinay7/shortner-gitops.git
    targetRevision: staging
    path:  services/url-analytics
    directory:
      recurse: true    
  destination:
      server: https://kubernetes.default.svc
      namespace: shortner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true       