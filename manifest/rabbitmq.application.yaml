apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-cluster
  namespace: argocd
spec:
  project: rabbitmq-cluster
  source:
    repoURL: https://github.com/bhatvinay7/shortner-gitops.git
    targetRevision: staging
    path:  rabbitmq-cluster
    directory:
      recurse: true    
  destination:
      server: https://kubernetes.default.svc
      namespace: shortner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true       